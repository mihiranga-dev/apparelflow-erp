[build]
  # `--include=dev` is mandatory: Netlify sets NODE_ENV=production during
  # builds, which makes npm skip devDependencies by default — but tsup
  # (packages/shared) and vite/tsc (client) are all dev-only tooling.
  # Without this flag, the build fails with `sh: 1: tsup: not found`.
  command = "npm install --include=dev && npm run build:shared && npm run build:client"
  publish = "client/dist"


[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Netlify's free tier caps synchronous functions at 10s. Our longest
  # endpoint (approve with a transaction) completes in <500ms.
  included_files = ["packages/shared/dist/**"]

# ─── API proxy to the Express function ──────────────────────────────────────
# Path prefixes are preserved so the function sees the same routes Express
# was written against (/auth/login, /api/orders, etc.) — no route rewrites
# needed anywhere in the server code.

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# ─── SPA fallback (must be last) ────────────────────────────────────────────

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
